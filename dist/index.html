<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>画图解题法 · DrawMathHub 复刻</title>
<style>
:root {
  /* 对齐原站 DrawMathHub 设计令牌 */
  --bg: #292c30;                 /* background  rgb(41,44,48) */
  --bg-deep: #232529;
  --primary: #c9563a;            /* primary     rgb(201,86,58) 橙红 */
  --primary-dark: #a8432c;
  --primary-soft: rgba(201,86,58,0.16);
  --success: #6a9f8c;            /* success     rgb(106,159,140) 青绿 */
  --warning: #e0a458;
  --text: #ead6b8;               /* text        奶油米黄 rgb(234,214,184) */
  --text-secondary: rgba(234,214,184,0.72);
  --text-tertiary: rgba(234,214,184,0.45);
  --border: rgba(234,214,184,0.14);
  --border-strong: rgba(234,214,184,0.28);
  --glass: rgba(255,255,255,0.045);
  --glass-2: rgba(255,255,255,0.07);
  --radius: 16px;
  --radius-sm: 10px;
  --shadow-card: 0 8px 30px rgba(0,0,0,0.35);
  --shadow-nav: 0 2px 18px rgba(0,0,0,0.4);
  --font: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  font-family: var(--font);
  color: var(--text);
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(201,86,58,0.10), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(106,159,140,0.08), transparent 55%),
    var(--bg);
  background-attachment: fixed;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

#app { min-height: 100%; display: flex; flex-direction: column; }

/* ---------- 导航栏 glass-nav ---------- */
.nav {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 14px;
  padding: 12px 20px;
  background: rgba(35,37,41,0.72);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-nav);
}
.brand { font-weight: 800; font-size: 18px; letter-spacing: .5px; display: flex; align-items: center; gap: 8px; }
.brand .logo { font-size: 20px; }
.brand .sub { font-size: 12px; font-weight: 500; color: var(--text-tertiary); }
.nav-spacer { flex: 1; }
.nav-user { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text-secondary); }
.nav-user .who { color: var(--text); font-weight: 600; }
.btn-ghost {
  background: transparent; border: 1px solid var(--border-strong); color: var(--text-secondary);
  padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 13px; transition: .2s;
}
.btn-ghost:hover { color: var(--text); border-color: var(--primary); }

/* ---------- 容器 ---------- */
.container { width: 100%; max-width: 920px; margin: 0 auto; padding: 24px 18px 80px; flex: 1; }
.page-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
.page-sub { color: var(--text-tertiary); font-size: 14px; margin-bottom: 20px; }

/* ---------- 玻璃卡片 glass-card ---------- */
.card {
  background: var(--glass);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 18px;
  box-shadow: var(--shadow-card);
  transition: border-color .2s, transform .2s;
}
.card + .card { margin-top: 16px; }
.card:hover { border-color: var(--border-strong); }
.card-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 15px; font-weight: 700; color: var(--text);
  padding-bottom: 12px; margin-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.card-title .ic { font-size: 17px; }
.card-title .tag { margin-left: auto; }

/* ---------- 首页 hero ---------- */
.hero { text-align: center; padding: 40px 16px 28px; }
.hero .logo-big { font-size: 52px; }
.hero h1 { font-size: 28px; font-weight: 800; margin: 10px 0 6px; }
.hero .tagline { color: var(--text-secondary); font-size: 15px; }

/* ---------- 昵称卡片 / 表单 ---------- */
.nick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 12px; margin: 14px 0; }
.nick-card {
  background: var(--glass-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 16px; cursor: pointer; text-align: center; transition: .2s;
}
.nick-card:hover { border-color: var(--primary); transform: translateY(-2px); }
.nick-card .av { font-size: 30px; }
.nick-card .nm { font-weight: 700; margin-top: 6px; }
.nick-card .meta { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }

.form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.form-row label { font-size: 13px; color: var(--text-secondary); }
.input {
  background: rgba(0,0,0,0.25); border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  padding: 11px 13px; color: var(--text); font-size: 15px; font-family: inherit; outline: none; transition: .2s;
}
.input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.input::placeholder { color: var(--text-tertiary); }
.hint-text { font-size: 12px; color: var(--text-tertiary); }
.err-text { font-size: 13px; color: var(--warning); min-height: 18px; }

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff; border: none; border-radius: var(--radius-sm);
  padding: 12px 18px; font-size: 15px; font-weight: 700; cursor: pointer; transition: .2s;
  box-shadow: 0 6px 18px rgba(201,86,58,0.35);
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.btn-block { width: 100%; }
.btn-secondary {
  background: var(--glass-2); color: var(--text); border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm); padding: 10px 16px; font-size: 14px; cursor: pointer; transition: .2s;
}
.btn-secondary:hover { border-color: var(--primary); }

/* ---------- 大厅：方法分组 ---------- */
.group { margin-bottom: 22px; }
.group-head { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; margin-bottom: 12px; }
.group-head .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--primary); }
.prob-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 12px; }
.prob-card {
  background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 14px; cursor: pointer; transition: .2s; position: relative; overflow: hidden;
}
.prob-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-card); }
.prob-card .lesson { font-size: 12px; color: var(--text-tertiary); }
.prob-card .ttl { font-weight: 700; margin: 4px 0 8px; font-size: 15px; }
.prob-card .method { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 999px;
  background: var(--primary-soft); color: var(--text); border: 1px solid rgba(201,86,58,0.35); }
.prob-card .done { position: absolute; top: 10px; right: 10px; font-size: 16px; }

/* ---------- 题目详情 ---------- */
.detail-head { margin-bottom: 18px; }
.detail-head .lesson { color: var(--text-tertiary); font-size: 13px; }
.detail-head h2 { font-size: 22px; font-weight: 800; margin: 4px 0 8px; }
.method-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600;
  padding: 5px 12px; border-radius: 999px; background: var(--primary-soft);
  border: 1px solid rgba(201,86,58,0.4); color: var(--text); }

.prose { white-space: pre-wrap; font-size: 15px; color: var(--text); }
.prose .em { color: var(--primary); font-weight: 600; }

/* 分步讲解播放器 */
.steps { display: flex; flex-direction: column; gap: 10px; }
.step {
  background: rgba(0,0,0,0.22); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 12px 14px; font-size: 15px; opacity: .35; transform: translateX(0);
  transition: opacity .35s ease, border-color .35s ease, box-shadow .35s ease, transform .35s ease;
}
.step.done { opacity: .7; }
.step.active { opacity: 1; border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); transform: translateX(3px); animation: stepIn .45s ease; }
@keyframes stepIn { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: translateX(3px); } }
.step .idx { color: var(--primary); font-weight: 700; margin-right: 8px; }
.step-player { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.step-status { font-size: 13px; color: var(--text-tertiary); }
.step-progress { height: 4px; background: rgba(0,0,0,0.3); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.step-progress .bar { height: 100%; background: var(--primary); width: 0; transition: width .45s ease; }

/* 画图草稿区 */
.board-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.tool-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--glass-2); border: 1px solid var(--border-strong); color: var(--text);
  border-radius: var(--radius-sm); padding: 8px 12px; font-size: 13px; cursor: pointer; transition: .2s;
}
.tool-btn:hover { border-color: var(--primary); }
.tool-btn.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.tool-sep { width: 1px; height: 22px; background: var(--border-strong); margin: 0 2px; }
.tool-hint { font-size: 12px; color: var(--text-tertiary); margin-left: auto; }
.board-wrap { border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); overflow: hidden; background: rgba(0,0,0,0.2); }
.board-wrap canvas { display: block; cursor: crosshair; touch-action: none; }

/* 讲解视频占位 */
.video-box {
  aspect-ratio: 16/9; border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: linear-gradient(135deg, rgba(0,0,0,0.35), rgba(201,86,58,0.08));
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  color: var(--text-tertiary); font-size: 14px; text-align: center; padding: 20px;
}
.video-box .play { font-size: 36px; opacity: .6; }

/* 练习判分 */
.ex-item { padding: 14px 0; border-bottom: 1px solid var(--border); }
.ex-item:last-child { border-bottom: none; }
.ex-q { font-size: 15px; margin-bottom: 10px; }
.ex-q .diff { font-size: 12px; color: var(--warning); margin-left: 8px; }
.ex-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ex-input { flex: 1; min-width: 160px; }
.ex-feedback { margin-top: 10px; font-size: 14px; font-weight: 600; }
.ex-feedback.ok { color: var(--success); }
.ex-feedback.no { color: var(--warning); }
.ex-ans { font-size: 14px; color: var(--text-secondary); margin-top: 6px; }
.ex-ans b { color: var(--text); }

/* 延伸题 */
.ext-item { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; margin-top: 10px; }
.ext-item .q { font-size: 14px; }
.ext-item .meta { display: flex; gap: 10px; margin-top: 8px; align-items: center; }
.ext-toggle { font-size: 13px; color: var(--primary); cursor: pointer; background: none; border: none; }
.ext-hint, .ext-ans { font-size: 13px; color: var(--text-secondary); margin-top: 6px; }
.ext-ans b { color: var(--text); }

/* 统计 */
.stats { display: flex; gap: 12px; margin: 16px 0; flex-wrap: wrap; }
.stat {
  flex: 1; min-width: 120px; background: var(--glass); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 14px; text-align: center;
}
.stat .num { font-size: 26px; font-weight: 800; color: var(--primary); }
.stat .lbl { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }

/* 底部导航/返回 */
.back-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.back-btn { background: var(--glass-2); border: 1px solid var(--border-strong); color: var(--text);
  border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 13px; transition: .2s; }
.back-btn:hover { border-color: var(--primary); }

.empty { text-align: center; color: var(--text-tertiary); padding: 40px 0; }
.footer-note { text-align: center; color: var(--text-tertiary); font-size: 12px; padding: 24px 0 8px; line-height: 1.8; }

@media (max-width: 560px) {
  .hero h1 { font-size: 23px; }
  .prob-grid, .nick-grid { grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); }
  .container { padding: 18px 12px 70px; }
}

</style>
</head>

/* ===== src/store.js ===== */


const NICKS_KEY = 'dmh_nicks'       // [{name, password, stats:{[pid]:{attempts,correct}}}]
const CUR_KEY = 'dmh_current'       // 当前昵称
const PROGRESS_KEY = 'dmh_progress'  // 兼容旧版：{ [pid]: 'mastered'|'practicing' }

function loadJSON(key, def) {
  try {
    const v = localStorage.getItem(key)
    return v ? JSON.parse(v) : def
  } catch (e) {
    return def
  }
}

const store = reactive({
  nicks: loadJSON(NICKS_KEY, []),
  current: localStorage.getItem(CUR_KEY) || '',
  problems: [],
  meta: null,
  loaded: false,

  // ---------- 昵称 / 登录 ----------
  allNicks() {
    return this.nicks
  },
  hasNicks() {
    return this.nicks.length > 0
  },
  findNick(name) {
    return this.nicks.find((n) => n.name === name) || null
  },
  createNick(name, password) {
    name = (name || '').trim()
    if (!name) return { ok: false, msg: '请输入昵称' }
    if (/\s/.test(name)) return { ok: false, msg: '昵称不能包含空格' }
    if (name.length > 12) return { ok: false, msg: '昵称最多 12 个字符' }
    if (this.findNick(name)) return { ok: false, msg: '该昵称已存在，请选择其他昵称' }
    this.nicks.push({ name, password: password || '', stats: {} })
    this._persistNicks()
    this.current = name
    localStorage.setItem(CUR_KEY, name)
    return { ok: true }
  },
  login(name, password) {
    const n = this.findNick(name)
    if (!n) return { ok: false, msg: '请检查昵称或密码' }
    if (n.password && n.password !== (password || '')) {
      return { ok: false, msg: '请检查昵称或密码' }
    }
    this.current = name
    localStorage.setItem(CUR_KEY, name)
    return { ok: true }
  },
  logout() {
    this.current = ''
    localStorage.removeItem(CUR_KEY)
  },
  curNick() {
    return this.findNick(this.current)
  },
  isAuthed() {
    return !!this.findNick(this.current)
  },

  // ---------- 练习统计 ----------
  recordPractice(pid, correct) {
    const n = this.curNick()
    if (!n) return
    const s = n.stats[pid] || { attempts: 0, correct: 0 }
    s.attempts += 1
    if (correct) s.correct += 1
    n.stats[pid] = s
    this._persistNicks()
  },
  totalAttempts() {
    const n = this.curNick()
    if (!n) return 0
    return Object.values(n.stats).reduce((a, s) => a + s.attempts, 0)
  },
  totalCorrect() {
    const n = this.curNick()
    if (!n) return 0
    return Object.values(n.stats).reduce((a, s) => a + s.correct, 0)
  },
  accuracy() {
    const a = this.totalAttempts()
    return a ? Math.round((this.totalCorrect() / a) * 100) : 0
  },
  practicedCount() {
    const n = this.curNick()
    if (!n) return 0
    return Object.values(n.stats).filter((s) => s.attempts > 0).length
  },

  // 兼容旧版进度标记（用于大厅“已练”角标）
  _legacyProgress() {
    return loadJSON(PROGRESS_KEY, {})
  },
  isPracticed(pid) {
    const n = this.curNick()
    if (n && n.stats[pid] && n.stats[pid].attempts > 0) return true
    return !!this._legacyProgress()[pid]
  },

  // ---------- 方法分组（大厅） ----------
  groupsByMethod() {
    const map = new Map()
    for (const p of this.problems) {
      const m = p.method || '其他'
      if (!map.has(m)) map.set(m, [])
      map.get(m).push(p)
    }
    return [...map.entries()].map(([method, list]) => ({
      method,
      list: list.sort((a, b) => (a.lessonNumber || 0) - (b.lessonNumber || 0)),
    }))
  },

  // ---------- 数据加载 ----------
  async load() {
    if (this.loaded) return
    const d = window.__DMH_DATA__ || (await (await fetch('./src/data/problems.json')).json())
    this.problems = d.problems
    this.meta = d.meta
    this.loaded = true
  },

  _persistNicks() {
    localStorage.setItem(NICKS_KEY, JSON.stringify(this.nicks))
  },
})

// 画图草稿区：自由画笔 / 橡皮 / 矩形 / 圆 / 直线 / 文字 / 撤销 / 清空 / 线宽 / 颜色
// 对齐原站「画图工具」工具条；笔触用奶油色，适配暗色画布
const FreeBoard = {
  props: { problem: Object },
  template: `
  <div>
    <div class="board-toolbar">
      <button class="tool-btn" :class="{on: mode==='pen'}" @click="setMode('pen')">✏️ 画笔</button>
      <button class="tool-btn" :class="{on: mode==='eraser'}" @click="setMode('eraser')">🩹 橡皮</button>
      <button class="tool-btn" :class="{on: mode==='rect'}" @click="setMode('rect')">▭ 矩形</button>
      <button class="tool-btn" :class="{on: mode==='circle'}" @click="setMode('circle')">◯ 圆</button>
      <button class="tool-btn" :class="{on: mode==='line'}" @click="setMode('line')">／ 直线</button>
      <button class="tool-btn" :class="{on: mode==='text'}" @click="setText">T 文字</button>
      <span class="tool-sep"></span>
      <label class="tool-btn" style="cursor:pointer">📏 线宽
        <select v-model="width" style="background:transparent;border:none;color:inherit;font-size:13px">
          <option v-for="w in [2,3,5,8]" :key="w" :value="w">{{ w }}</option>
        </select>
      </label>
      <label class="tool-btn" style="cursor:pointer">🎨 颜色
        <input type="color" v-model="color" style="width:22px;height:18px;border:none;background:none;padding:0;vertical-align:middle" />
      </label>
      <span class="tool-sep"></span>
      <button class="tool-btn" @click="undo">↩ 撤销</button>
      <button class="tool-btn" @click="clearAll">🗑 清空</button>
      <span class="tool-hint">选工具后在画布上绘制 · 图形可拖动</span>
    </div>
    <div class="board-wrap" ref="container"></div>
  </div>
  `,
  setup(props) {
    const container = ref(null)
    const mode = ref('pen')
    const width = ref(3)
    const color = ref('#ead6b8')
    let stage = null
    let layer = null
    let drawing = false
    let current = null
    let history = []
    let resizeHandler = null

    function setMode(m) {
      mode.value = m
    }
    function setText() {
      const v = prompt('输入文字：')
      if (v) {
        const pos = stage.getPointerPosition() || { x: 80, y: 80 }
        addNode(
          new window.Konva.Text({ x: pos.x, y: pos.y, text: v, fontSize: 18, fill: color.value, draggable: true })
        )
      }
    }
    function addNode(node) {
      layer.add(node)
      history.push(node)
      layer.draw()
    }
    function clearAll() {
      layer.destroyChildren()
      history = []
      layer.draw()
    }
    function undo() {
      const n = history.pop()
      if (n) n.destroy()
      layer.draw()
    }

    function bind() {
      const get = () => stage.getPointerPosition()
      stage.on('mousedown touchstart', (e) => {
        const pos = get()
        if (!pos) return
        if (mode.value === 'eraser') {
          const t = e.target
          if (t && t !== stage && t !== layer) {
            const idx = history.indexOf(t)
            if (idx >= 0) history.splice(idx, 1)
            t.destroy()
            layer.draw()
          }
          return
        }
        if (mode.value === 'pen') {
          drawing = true
          current = new window.Konva.Line({
            points: [pos.x, pos.y],
            stroke: color.value,
            strokeWidth: width.value,
            lineCap: 'round',
            lineJoin: 'round',
            draggable: true,
          })
          addNode(current)
        } else if (mode.value === 'rect') {
          addNode(
            new window.Konva.Rect({ x: pos.x - 45, y: pos.y - 30, width: 90, height: 60, stroke: color.value, strokeWidth: width.value, draggable: true })
          )
        } else if (mode.value === 'circle') {
          addNode(
            new window.Konva.Circle({ x: pos.x, y: pos.y, radius: 42, stroke: color.value, strokeWidth: width.value, draggable: true })
          )
        } else if (mode.value === 'line') {
          addNode(
            new window.Konva.Line({ points: [pos.x - 45, pos.y, pos.x + 45, pos.y], stroke: color.value, strokeWidth: width.value, draggable: true })
          )
        }
      })
      stage.on('mousemove touchmove', () => {
        if (drawing && current) {
          const pos = get()
          const pts = current.points()
          pts.push(pos.x, pos.y)
          current.points(pts)
          layer.batchDraw()
        }
      })
      const end = () => {
        drawing = false
        current = null
      }
      stage.on('mouseup touchend', end)
      stage.on('mouseleave', end)
    }

    function onResize() {
      if (!stage || !container.value) return
      stage.width(container.value.clientWidth || 600)
      layer.draw()
    }

    onMounted(() => {
      try {
        if (!window.Konva || !container.value) return
        stage = new window.Konva.Stage({
          container: container.value,
          width: container.value.clientWidth || 600,
          height: 280,
        })
        layer = new window.Konva.Layer()
        stage.add(layer)
        bind()
        resizeHandler = onResize
        window.addEventListener('resize', resizeHandler)
      } catch (e) {
        // 无 canvas 的环境（如无头校验）下 Konva 初始化会失败，静默降级，不影响其余功能
        stage = null
      }
    })

    onBeforeUnmount(() => {
      if (resizeHandler) window.removeEventListener('resize', resizeHandler)
      if (stage) stage.destroy()
    })

    return { container, mode, width, color, setMode, setText, undo, clearAll }
  },
}

function norm(s) {
  return (s || '').toString().trim().replace(/\s+/g, '').replace(/[。.．]/g, '')
}
function toNum(s) {
  const m = (s || '').toString().match(/-?\d+(\.\d+)?/)
  return m ? parseFloat(m[0]) : NaN
}

const Problem = {
  components: { FreeBoard },
  template: `
  <div v-if="!problem" class="empty">题目未找到，请检查讲次编号</div>
  <div v-else>
    <div class="back-bar">
      <button class="back-btn" @click="back">← 返回大厅</button>
      <span style="color:var(--text-tertiary);font-size:13px">{{ problem.lesson }}</span>

    <!-- 分步讲解 -->

      <div class="steps">
        <div class="step" v-for="(s,i) in steps" :key="i" :class="{active: i===current, done: i<current}">
          <span class="idx">{{ i+1 }}.</span>{{ s }}
        </div>
      </div>
      <div class="step-progress"><div class="bar" :style="{width: progressPct}"></div></div>
      <div class="step-player">
        <button class="tool-btn" :class="{on: playing}" @click="play">{{ playing ? '⏸ 暂停' : '▶ 播放' }}</button>
        <button class="tool-btn" @click="next">⏭ 继续下一段</button>
        <button class="tool-btn" @click="restart">↻ 重播</button>
        <span class="step-status">{{ stepStatus }}</span>
      </div>
    </div>

    <!-- 讲解视频：紧跟分步讲解，一进页面即可看到（对齐原站"讲解即播放"的位置） -->
    <div class="card">
      <div class="card-title"><span class="ic">🎥</span> 讲解视频 <span class="tag" style="color:var(--text-tertiary);font-weight:500">原站真实讲解 · 随站部署</span></div>
      <!-- 播放器常驻可见：不用 v-show 隐藏，确保浏览器一定预加载并显示控件 -->
      <video :src="videoSrc" controls playsinline preload="auto" poster=""
             @loadeddata="videoState='ready'" @canplay="videoState='ready'" @error="onVideoError"
             style="width:100%;display:block;border-radius:10px;background:#111122;aspect-ratio:16/9"></video>
      <div v-if="videoState!=='ready'" class="video-status" style="margin-top:10px">
        <template v-if="videoState==='loading'">
          <span style="color:var(--text-tertiary);font-size:13px">⏳ 正在加载讲解视频…（首次加载约需几秒）</span>
        </template>
        <template v-else>
          <div style="color:var(--text-tertiary);font-size:13px;line-height:1.7">
            🎞️ 视频暂时无法加载。本视频随站点部署在
            <b>videos/{{ problem.id }}/{{ problem.mainProblem && problem.mainProblem.id }}/full.mp4</b>，
            若未随站打包会自动回退播放原站资源（需联网）。
            <a :href="videoSrc" target="_blank" style="color:var(--primary)">点此直接打开视频 →</a>
          </div>
        </template>
      </div>
    </div>

    <!-- 规范解答 -->
    <div class="card">
      <div class="card-title"><span class="ic">✅</span> 规范解答</div>
      <div class="prose" style="color:var(--success);font-weight:600">{{ problem.mainProblem.standardSolution }}</div>
    </div>

    <!-- 规律分析 -->
    <div class="card" v-if="problem.mainProblem.keyPoints">
      <div class="card-title"><span class="ic">💡</span> 规律分析</div>
      <div class="prose">{{ problem.mainProblem.keyPoints }}</div>
    </div>

    <!-- 画图草稿区 -->
    <div class="card">
      <div class="card-title"><span class="ic">✏️</span> 画图草稿区 <span class="tag" style="color:var(--text-tertiary);font-weight:500">选工具后在画布上自由绘制</span></div>
      <FreeBoard :problem="problem" />
    </div>

    <!-- 练习 -->
    <div class="card">
      <div class="card-title"><span class="ic">📝</span> 练习 <span class="tag" style="color:var(--text-tertiary);font-weight:500">提交后显示参考答案</span></div>
      <div class="ex-item" v-for="(ex,i) in problem.exercises" :key="i">
        <div class="ex-q">{{ i+1 }}. {{ ex.question }}<span class="diff" v-if="ex.difficulty">{{ ex.difficulty }}</span></div>
        <div class="ex-row">
          <input class="input ex-input" v-model="exInputs[i]" :placeholder="ex.answerKey && ex.answerKey.type==='number' ? '请输入数字' : '请输入答案'" @keyup.enter="submit(i)" />
          <button class="btn-secondary" @click="submit(i)">提交答案</button>
        </div>
        <div class="ex-feedback" v-if="exState[i]==='ok'" :class="{ok:true}">✓ 回答正确</div>
        <div class="ex-feedback" v-else-if="exState[i]==='no'" :class="{no:true}">还不对，请对照下方参考答案</div>
        <div class="ex-ans" v-if="exState[i]">参考答案：<b>{{ ex.answer }}</b></div>
      </div>
      <div v-if="!problem.exercises || !problem.exercises.length" class="empty">本题暂无练习</div>
    </div>

    <!-- 延伸题 -->
    <div class="card" v-if="problem.extensionProblems && problem.extensionProblems.length">
      <div class="card-title"><span class="ic">🔁</span> 延伸题</div>
      <div class="ext-item" v-for="(ex,i) in problem.extensionProblems" :key="i">
        <div class="q">{{ i+1 }}. {{ ex.question }} <span class="diff" v-if="ex.difficulty" style="color:var(--warning);font-size:12px">（{{ ex.difficulty }}）</span></div>
        <div class="meta">
          <button class="ext-toggle" @click="toggle('h'+i)">{{ open['h'+i] ? '收起提示' : '看提示' }}</button>
          <button class="ext-toggle" @click="toggle('a'+i)">{{ open['a'+i] ? '收起答案' : '看答案' }}</button>
        </div>
        <div class="ext-hint" v-if="open['h'+i]">💡 提示：{{ ex.hint }}</div>
        <div class="ext-ans" v-if="open['a'+i]">✅ 答案：<b>{{ ex.answer }}</b></div>
      </div>
    </div>

    <div style="height:30px"></div>
  </div>
  `,
  setup() {
    const route = useRoute()
    const problem = computed(
      () => store.problems.find((p) => String(p.id) === String(route.params.id)) || null
    )
    // 视频地址：对齐原站真实约定 videos/{题目id}/{mainProblem.id}/full.mp4
    // 本地优先（随站点部署、离线可用），本地缺失自动回退直连原站（原站公开且 CORS* 允许跨站播放）
    const videoMode = ref('local') // 'local' | 'remote'
    const videoSrc = computed(() => {
      const p = problem.value
      if (!p) return ''
      if (p.mainProblem && p.mainProblem.video) return p.mainProblem.video
      const puuid = p.id
      const euuid = p.mainProblem && p.mainProblem.id
      if (puuid && euuid) {
        const local = `videos/${puuid}/${euuid}/full.mp4`
        const remote = `https://sogrey.top/DrawMathHub/videos/${puuid}/${euuid}/full.mp4`
        return videoMode.value === 'local' ? local : remote
      }
      return ''
    })
    const videoState = ref('loading')
    function onVideoError() {
      if (videoMode.value === 'local') {
        videoMode.value = 'remote' // 本地缺失 → 回退原站
        videoState.value = 'loading'
      } else {
        videoState.value = 'missing' // 都失败 → 占位
      }
    }
    // 切换题目时重置视频状态，避免沿用上一题的加载结果
    watch(() => (problem.value && problem.value.id), () => {
      videoMode.value = 'local'
      videoState.value = 'loading'
    })

    // 分步讲解
    const steps = computed(() => {
      const raw = (problem.value && problem.value.mainProblem && problem.value.mainProblem.drawingAnalysis) || ''
      const out = []
      raw.split(/\n+/).map((s) => s.trim()).filter(Boolean).forEach((s) => {
        if (s.length > 70) {
          s.split(/(?<=[。！？])/).forEach((x) => x.trim() && out.push(x.trim()))
        } else out.push(s)
      })
      return out.length ? out : ['（暂无分步讲解内容）']
    })
    const current = ref(0)
    const playing = ref(false)
    const done = ref(false)
    let timer = null
    function schedule() {
      clearTimeout(timer)
      timer = setTimeout(() => {
        if (current.value < steps.value.length - 1) {
          current.value++
          if (playing.value) schedule()
        } else {
          playing.value = false
          done.value = true
        }
      }, 2600)
    }
    function play() {
      if (!problem.value) return
      if (playing.value) {
        pause()
        return
      }
      if (current.value >= steps.value.length - 1) current.value = 0
      done.value = false
      playing.value = true
      schedule()
    }
    function pause() {
      playing.value = false
      clearTimeout(timer)
    }
    function next() {
      pause()
      if (current.value < steps.value.length - 1) current.value++
    }
    const progressPct = computed(() => {
      const total = steps.value.length
      if (!total) return '0%'
      return (((current.value + 1) / total) * 100).toFixed(0) + '%'
    })
    const stepStatus = computed(() => {
      if (done.value) return '本分步讲解已看完 ✓'
      if (playing.value) return '讲解播放中…'
      if (current.value > 0) return '本段已播完，可继续下一段'
      return '讲解将自动播放'
    })
    onBeforeUnmount(() => clearTimeout(timer))

    // 练习判分
    const exInputs = ref({})
    const exState = ref({})
    function submit(i) {
      const ex = problem.value.exercises[i]
      const u = norm(exInputs.value[i])
      if (!u) {
        exState.value = { ...exState.value, [i]: 'empty' }
        return
      }
      let correct = false
      if (ex.answerKey && ex.answerKey.values && ex.answerKey.values.length) {
        if (ex.answerKey.type === 'number') {
          const un = toNum(u)
          correct = ex.answerKey.values.some((v) => toNum(v) === un)
        } else {
          correct = ex.answerKey.values.some((v) => norm(v) === u)
        }
      } else {
        correct = norm(ex.answer) === u
      }
      exState.value = { ...exState.value, [i]: correct ? 'ok' : 'no' }
      if (store.isAuthed()) store.recordPractice(problem.value.id, correct)
    }

    // 延伸题展开
    const open = ref({})
    function toggle(key) {
      open.value = { ...open.value, [key]: !open.value[key] }
    }

    function back() {
      location.hash = '#/'
    }

    function restart() {
      pause()
      current.value = 0
      playing.value = false
      done.value = false
    }

    onMounted(() => {
      store.load()
      // file:// 下本地视频缺失可能不触发 error 事件，6 秒兜底回退到原站远程源
      setTimeout(() => { if (videoState.value === 'loading' && videoMode.value === 'local') onVideoError() }, 6000)
      // 进入题目后自动开始分步讲解播放
      play()
    })

    return {
      store, problem, videoSrc, videoState, onVideoError, steps, current, playing, done, play, pause, next, restart, stepStatus, progressPct,
      exInputs, exState, submit, open, toggle, back,
    }
  },
}

const routes = [

]

app.use(router)

// 先加载题库数据 + 等路由完成初始导航，确保直接访问 #/problem/:id 时参数已就绪
Promise.resolve().then(() => store.load()).then(() => router.isReady()).then(() => app.mount('#app'))
</script>
